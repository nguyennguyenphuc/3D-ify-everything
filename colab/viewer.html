<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courtyard Tour</title>
<style>
:root{--bg:#f4f4f1;--panel:#ffffff;--ink:#1c1f1e;--muted:#5d6461;--line:#d9dcd8;--accent:#2f6f5e;--canvas:#1a1d1c;--glass:rgba(20,23,22,.72);--glass-ink:#f2f4f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1211;--panel:#171b1a;--ink:#e8ebe9;--muted:#9aa39f;--line:#2a302e;--accent:#6cc3a8;--canvas:#101312}}
:root[data-theme="dark"]{--bg:#0f1211;--panel:#171b1a;--ink:#e8ebe9;--muted:#9aa39f;--line:#2a302e;--accent:#6cc3a8;--canvas:#101312}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#stage{position:relative;height:100vh;height:100dvh;background:var(--canvas);overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage.dragging canvas{cursor:grabbing}
.glass{position:absolute;background:var(--glass);color:var(--glass-ink);border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#title{top:16px;left:16px;padding:6px 14px;font-weight:600;font-size:14px}
#modes{bottom:20px;left:16px;display:flex;gap:2px;padding:4px}
#modes button,#models select{font:inherit;font-size:14px;color:inherit;background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
#modes button[aria-pressed="true"]{background:var(--glass-ink);color:#141716;font-weight:600}
#models{top:16px;right:16px;padding:2px 6px}
#models select option{color:#141716}
#hint{bottom:24px;left:50%;transform:translateX(-50%);padding:6px 14px;font-size:13px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#status{top:58px;left:16px;padding:4px 12px;font-size:12px;border-radius:8px;max-width:calc(100% - 32px)}
#status:empty{display:none}
@media (max-width:640px){#hint{display:none}#modes button{padding:7px 10px}}
main{padding:16px;display:grid;gap:12px;max-width:1200px;margin:0 auto}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.wipe{position:relative;max-width:100%;overflow:hidden;border-radius:6px;margin-top:10px}
.wipe img{display:block;width:100%;height:auto}
.wipe .top{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;color:var(--muted);font-size:13px}
input[type=range]{flex:1;min-width:140px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:10px 0 0;font-size:13px;color:var(--muted)}
dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "fflate":"https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
  "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
}}
</script>
</head>
<body>
<div id="stage">
  <div id="title" class="glass">Courtyard · tham quan 3D</div>
  <div id="status" class="glass" role="status">Đang tải…</div>
  <div id="models" class="glass"><select id="model" aria-label="Mô hình">
    <option value="splat.ply" data-kind="splat">Splat ArtiFixer3D</option>
    <option value="baseline.ply" data-kind="splat">Splat gốc 3DGUT</option>
    <option value="points.ply" data-kind="points">Point cloud VGGT</option>
  </select></div>
  <div id="modes" class="glass" role="group" aria-label="Chế độ xem">
    <button data-mode="inside" aria-pressed="true">Tham quan</button>
    <button data-mode="dollhouse" aria-pressed="false">Dollhouse</button>
    <button data-mode="plan" aria-pressed="false">Mặt bằng</button>
  </div>
  <div id="hint" class="glass">Kéo để nhìn quanh · bấm vòng tròn trên sàn để di chuyển · phím ↑ ↓ ← →</div>
</div>
<main>
  <details id="compare" hidden>
    <summary>So sánh khung hình quỹ đạo mới (ArtiFixer ↔ render gốc)</summary>
    <div class="wipe"><img id="img-a" alt="Render 3DGUT"><img id="img-b" class="top" alt="ArtiFixer đã sửa"></div>
    <div class="row">
      <label for="frame">Khung</label><input id="frame" type="range" min="0" max="0" value="0">
      <label for="split">Trái: ArtiFixer · Phải: render gốc</label><input id="split" type="range" min="0" max="100" value="50">
    </div>
  </details>
  <details><summary>Thông số</summary><dl id="facts"></dl></details>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PLYLoader} from 'three/addons/loaders/PLYLoader.js';
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
const V=a=>new THREE.Vector3(a[0],a[1],a[2]);
const json=async f=>{try{const r=await fetch(f);return r.ok?await r.json():null}catch{return null}};
const exists=async f=>{try{return (await fetch(f,{method:'HEAD'})).ok}catch{return false}};

// Browsers block fetch() from file:// pages, so a double-clicked index.html can read nothing.
if(location.protocol==='file:'){status('Trình duyệt chặn đọc file khi mở trực tiếp. Trong thư mục này chạy: python -m http.server 8765 rồi mở http://127.0.0.1:8765');throw new Error('file://')}

const metrics=await json('metrics.json')||{}, cams=((await json('cameras.json'))||{}).cameras||[], sceneInfo=await json('scene.json');
const files=new Set(metrics.files||[]);
for(const f of ['splat.ply','baseline.ply','points.ply']) if(!files.has(f)&&await exists(f)) files.add(f);
if(!cams.length){status('Thiếu cameras.json: không dựng được điểm tham quan.');throw new Error('no cameras')}

// Scene frame: up axis, horizontal axes, floor height, crop box. scene.json comes from `pipeline tidy`;
// older results fall back to the same estimate from cameras.json + points.ply.
let U,E1,E2,floor,center,radius;
if(sceneInfo){
  [E1,E2,U]=sceneInfo.axes.map(V); floor=sceneInfo.floor; center=V(sceneInfo.center);
  radius=V(sceneInfo.half_size).length();
}else{
  const down=new THREE.Vector3(); cams.forEach(c=>down.add(V(c.w2c[1]))); U=down.normalize().negate();
  E1=new THREE.Vector3(1,0,0); if(Math.abs(E1.dot(U))>.9)E1.set(0,0,1);
  E1.addScaledVector(U,-E1.dot(U)).normalize(); E2=new THREE.Vector3().crossVectors(U,E1);
  const g=files.has('points.ply')?new PLYLoader().parse(await (await fetch('points.ply')).arrayBuffer()):null;
  if(g){const p=g.attributes.position,h=[];for(let i=0;i<p.count;i+=7)h.push(p.getX(i)*U.x+p.getY(i)*U.y+p.getZ(i)*U.z);
    h.sort((a,b)=>a-b);floor=h[Math.floor(h.length*.02)];g.computeBoundingSphere();center=g.boundingSphere.center.clone();radius=g.boundingSphere.radius;g.dispose()}
}

// Sweeps = source camera positions, thinned so dense video captures do not crowd the floor.
const raw=cams.map((c,i)=>{const m=c.viewer_c2w;return{i,eye:new THREE.Vector3(m[0][3],m[1][3],m[2][3]),
  fwd:new THREE.Vector3(-m[0][2],-m[1][2],-m[2][2]).normalize(),fov:2*Math.atan(c.wh[1]/(2*c.K[1][1]))*180/Math.PI}});
const nearest=raw.map(a=>Math.min(...raw.filter(b=>b!==a).map(b=>a.eye.distanceTo(b.eye)),Infinity));
const spacing=raw.length>1?[...nearest].sort((a,b)=>a-b)[Math.floor(nearest.length/2)]:1;
const sweeps=[];for(const s of raw) if(sweeps.every(k=>k.eye.distanceTo(s.eye)>=.25*spacing))sweeps.push(s);
if(floor===undefined)floor=Math.min(...sweeps.map(s=>s.eye.dot(U)))-spacing;
if(!center){center=sweeps.reduce((a,s)=>a.add(s.eye),new THREE.Vector3()).divideScalar(sweeps.length);radius=spacing*sweeps.length}
const onFloor=p=>p.clone().addScaledVector(U,floor-p.dot(U));
const ringR=Math.max(Math.min(spacing*.28,radius*.08),radius*.015);

// Renderer, camera, controls -----------------------------------------------------
const stage=$('stage'), renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); stage.prepend(renderer.domElement);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(60,1,radius/2000,radius*50);
camera.up.copy(U);  // OrbitControls reads camera.up when constructed
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.enabled=false;
const resize=()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
new ResizeObserver(resize).observe(stage); resize();

// Floor markers: a ring per sweep, plus a disc that follows the pointer.
const markerMat=()=>new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.75,depthTest:false,depthWrite:false,side:THREE.DoubleSide});
const toFloorPlane=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),U);
const markers=new THREE.Group(); markers.renderOrder=10; scene.add(markers);
sweeps.forEach((s,k)=>{
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.RingGeometry(ringR*.72,ringR,48),markerMat()));
  const fill=new THREE.Mesh(new THREE.CircleGeometry(ringR*.72,48),markerMat()); fill.material.opacity=.18; g.add(fill);
  g.position.copy(onFloor(s.eye)).addScaledVector(U,ringR*.02); g.quaternion.copy(toFloorPlane); g.userData.sweep=k; g.renderOrder=10;
  g.children.forEach(m=>{m.renderOrder=10;m.userData.sweep=k}); markers.add(g);
});
const cursor=new THREE.Mesh(new THREE.RingGeometry(ringR*.55,ringR*.7,48),markerMat());
cursor.quaternion.copy(toFloorPlane); cursor.renderOrder=11; cursor.visible=false; scene.add(cursor);

// Look direction <-> yaw/pitch in the scene frame.
const view={mode:'inside',sweep:0,yaw:0,pitch:0,fov:60};
const dirOf=(y,p)=>new THREE.Vector3().addScaledVector(E1,Math.cos(p)*Math.cos(y)).addScaledVector(E2,Math.cos(p)*Math.sin(y)).addScaledVector(U,Math.sin(p));
const setDir=d=>{d=d.clone().normalize();view.pitch=Math.asin(THREE.MathUtils.clamp(d.dot(U),-1,1));view.yaw=Math.atan2(d.dot(E2),d.dot(E1))};
// Matrix4.lookAt uses the camera convention (looks down -Z); Object3D.lookAt would face +Z for non-cameras.
const lookQuat=(pos,dir)=>new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(pos,pos.clone().add(dir),U));

// One tween for every camera move: position + orientation + fov.
let tween=null;
function flyTo(pos,quat,fov,ms,done){
  tween={p0:camera.position.clone(),q0:camera.quaternion.clone(),f0:camera.fov,p1:pos,q1:quat,f1:fov,t0:performance.now(),ms,done};
}
function stepTween(now){
  if(!tween)return;
  const t=Math.min(1,(now-tween.t0)/tween.ms), e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  camera.position.lerpVectors(tween.p0,tween.p1,e); camera.quaternion.slerpQuaternions(tween.q0,tween.q1,e);
  camera.fov=tween.f0+(tween.f1-tween.f0)*e; camera.updateProjectionMatrix();
  if(t>=1){const d=tween.done;tween=null;d&&d()}
}

function setMode(mode){
  view.mode=mode; document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  $('hint').style.opacity=mode==='inside'?1:0;
  markers.children.forEach(m=>m.visible=mode!=='inside'||m.userData.sweep!==view.sweep);
}
function goInside(k,dir){
  const s=sweeps[k]; view.sweep=k; controls.enabled=false; setMode('inside');
  if(dir)setDir(dir);
  const q=lookQuat(s.eye,dirOf(view.yaw,view.pitch));
  flyTo(s.eye.clone(),q,view.fov,camera.position.distanceTo(s.eye)<1e-6?1:700);
}
function goOrbit(mode){
  controls.enabled=false; setMode(mode);
  const avgFwd=sweeps.reduce((a,s)=>a.add(s.fwd),new THREE.Vector3()); avgFwd.addScaledVector(U,-avgFwd.dot(U));
  if(avgFwd.lengthSq()<1e-9)avgFwd.copy(E1); avgFwd.normalize();
  const pos=mode==='plan'
    ? center.clone().addScaledVector(U,radius*2.6).addScaledVector(avgFwd,-radius*.001)
    : center.clone().addScaledVector(avgFwd,-radius*1.9).addScaledVector(U,radius*1.2);
  controls.target.copy(center);
  controls.minPolarAngle=0; controls.maxPolarAngle=mode==='plan'?0:Math.PI/2;
  controls.enableRotate=true; controls.screenSpacePanning=true;
  flyTo(pos,lookQuat(pos,center.clone().sub(pos)),50,900,()=>{controls.enabled=true;controls.update()});
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>b.dataset.mode==='inside'?goInside(view.sweep):goOrbit(b.dataset.mode));

// Pointer: drag = look around (inside) / orbit (other modes), click = move to a sweep.
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), floorPlane=new THREE.Plane(U.clone(),-floor);
let down=null;
const pointer=e=>{const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera)};
function pickSweep(){
  const visible=markers.children.filter(m=>m.visible);
  const hit=ray.intersectObjects(visible,true)[0];
  if(hit)return hit.object.userData.sweep;
  const p=ray.ray.intersectPlane(floorPlane,new THREE.Vector3());
  let best=null,bd=Infinity;
  if(p&&view.mode==='inside'&&ray.ray.direction.dot(U)<0){
    sweeps.forEach((s,k)=>{if(k===view.sweep)return;const d=onFloor(s.eye).distanceTo(p);if(d<bd){bd=d;best=k}});
    if(bd<Math.max(spacing*1.5,ringR*4))return best;
  }
  // Looking at a wall or above the horizon: the sweep closest to the clicked direction.
  let ba=.35;best=null;
  sweeps.forEach((s,k)=>{if(k===view.sweep&&view.mode==='inside')return;const a=ray.ray.direction.angleTo(s.eye.clone().sub(camera.position));if(a<ba){ba=a;best=k}});
  return best;
}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,moved:0};if(view.mode==='inside'){renderer.domElement.setPointerCapture(e.pointerId);stage.classList.add('dragging')}});
renderer.domElement.addEventListener('pointermove',e=>{
  pointer(e);
  if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;down.moved+=Math.abs(dx)+Math.abs(dy);down.x=e.clientX;down.y=e.clientY;
    if(view.mode==='inside'&&!tween){const k=view.fov/60*.0045;view.yaw+=dx*k;view.pitch=THREE.MathUtils.clamp(view.pitch+dy*k,-1.45,1.45);
      camera.quaternion.copy(lookQuat(camera.position,dirOf(view.yaw,view.pitch)))}}
  hover();
});
renderer.domElement.addEventListener('pointerup',e=>{
  stage.classList.remove('dragging');
  if(down&&down.moved<6){pointer(e);const k=pickSweep();
    if(k!==null&&k!==undefined)view.mode==='inside'?goInside(k):goInside(k,sweeps[k].fwd)}
  down=null;
});
renderer.domElement.addEventListener('wheel',e=>{if(view.mode!=='inside')return;e.preventDefault();
  view.fov=THREE.MathUtils.clamp(view.fov*Math.exp(e.deltaY*.001),25,95);camera.fov=view.fov;camera.updateProjectionMatrix()},{passive:false});
function hover(){
  markers.children.forEach(m=>{m.scale.setScalar(1);m.children[0].material.opacity=.75});
  cursor.visible=false;
  if(view.mode!=='inside'||tween)return;
  const p=ray.ray.direction.dot(U)<0&&ray.ray.intersectPlane(floorPlane,new THREE.Vector3());
  if(!p||p.distanceTo(camera.position)>radius*3)return;
  cursor.position.copy(p).addScaledVector(U,ringR*.03); cursor.visible=true;
  let best=null,bd=Infinity; markers.children.forEach(m=>{if(!m.visible)return;const d=m.position.distanceTo(p);if(d<bd){bd=d;best=m}});
  if(best&&bd<ringR*2.5){best.scale.setScalar(1.25);best.children[0].material.opacity=1}
}
addEventListener('keydown',e=>{
  if(view.mode!=='inside'||tween||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){view.yaw+=(e.key==='ArrowLeft'?1:-1)*Math.PI/12;
    flyTo(camera.position.clone(),lookQuat(camera.position,dirOf(view.yaw,view.pitch)),view.fov,250);e.preventDefault()}
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    const f=dirOf(view.yaw,0).multiplyScalar(e.key==='ArrowUp'?1:-1);let best=null,bd=Infinity;
    sweeps.forEach((s,k)=>{if(k===view.sweep)return;const v=s.eye.clone().sub(camera.position);v.addScaledVector(U,-v.dot(U));
      if(v.angleTo(f)<Math.PI/4&&v.length()<bd){bd=v.length();best=k}});
    if(best!==null)goInside(best); e.preventDefault()}
});

// Models --------------------------------------------------------------------------
let current=null, spark=null;
async function load(opt){
  if(current){scene.remove(current);current.dispose?.();current.geometry?.dispose();current=null}
  status(`Đang tải ${opt.value}…`);
  try{
    if(opt.dataset.kind==='splat'){
      const {SplatMesh,SparkRenderer}=await import('@sparkjsdev/spark');
      if(!spark){spark=new SparkRenderer({renderer});scene.add(spark)}
      current=new SplatMesh({url:opt.value}); await current.initialized;
    }else{
      const g=new PLYLoader().parse(await (await fetch(opt.value)).arrayBuffer());
      current=new THREE.Points(g,new THREE.PointsMaterial({size:2,vertexColors:true,sizeAttenuation:false}));
    }
    scene.add(current); status('');
  }catch(e){status(`Lỗi tải ${opt.value}: ${e.message||e}`)}
}
const model=$('model');
[...model.options].forEach(o=>o.disabled=!files.has(o.value));
const first=[...model.options].find(o=>!o.disabled);
model.value=first?first.value:''; model.onchange=()=>load(model.selectedOptions[0]);

// Start inside at the first sweep, looking where that photo looked.
const s0=sweeps[0]; setDir(s0.fwd); view.fov=THREE.MathUtils.clamp(s0.fov,40,80);
camera.position.copy(s0.eye); camera.quaternion.copy(lookQuat(s0.eye,s0.fwd)); camera.fov=view.fov; camera.updateProjectionMatrix();
setMode('inside');
first?load(first):status('Không có file PLY nào trong thư mục này.');
// Read-only hook for automated checks (web/verify-viewer.mjs style): ring screen positions and current view.
window.__tour={state:()=>({mode:view.mode,sweep:view.sweep,moving:!!tween}),
  rings:()=>{const r=renderer.domElement.getBoundingClientRect();return markers.children.filter(m=>m.visible).map(m=>{
    const p=m.position.clone().project(camera);return[r.left+(p.x+1)/2*r.width,r.top+(1-p.y)/2*r.height,m.userData.sweep,p.z]}).filter(p=>p[3]<1).map(p=>p.slice(0,3))}};
// Shareable views: #sweep=3 or #mode=dollhouse / #mode=plan.
const hash=new URLSearchParams(location.hash.slice(1)), k0=+hash.get('sweep');
if(hash.get('mode')==='dollhouse'||hash.get('mode')==='plan')goOrbit(hash.get('mode'));
else if(k0>0&&k0<sweeps.length)goInside(k0,sweeps[k0].fwd);
// Same draw path as web/src/Viewer.tsx: SparkRenderer draws the scene once splats exist.
renderer.setAnimationLoop(now=>{if(document.hidden)return;stepTween(now);if(controls.enabled)controls.update();spark?spark.render(scene,camera):renderer.render(scene,camera)});

// Details below the tour ------------------------------------------------------------
const facts={Scene:metrics.name,GPU:metrics.gpu&&metrics.gpu.name,'Điểm tham quan':`${sweeps.length} / ${cams.length} camera`,
  'Splat ArtiFixer3D':metrics.tidy?.splat?`${metrics.tidy.splat.after.toLocaleString()} Gaussian (cắt từ ${metrics.tidy.splat.before.toLocaleString()})`:metrics.artifixer3d_ply&&`${metrics.artifixer3d_ply.splats.toLocaleString()} Gaussian`,
  'Splat gốc':metrics.tidy?.baseline?`${metrics.tidy.baseline.after.toLocaleString()} Gaussian`:metrics.baseline_ply&&`${metrics.baseline_ply.splats.toLocaleString()} Gaussian`,
  'Metric scale':metrics.metric_scale,'Ghi chú':metrics.note};
for(const [k,v] of Object.entries(facts)) if(v){$('facts').append(Object.assign(document.createElement('dt'),{textContent:k}),Object.assign(document.createElement('dd'),{textContent:v}))}
const frames=[...files].filter(f=>f.startsWith('fixed_frames/')).sort();
if(frames.length){
  $('compare').hidden=false; $('frame').max=frames.length-1;
  const show=()=>{const f=frames[+$('frame').value];$('img-b').src=f;$('img-a').src=f.replace('fixed_frames/','rendered_frames/')};
  $('frame').oninput=show; $('split').oninput=()=>$('img-b').style.clipPath=`inset(0 ${100-$('split').value}% 0 0)`; show();
}
</script>
</body>
</html>
