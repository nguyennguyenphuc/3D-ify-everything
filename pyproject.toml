[project]
name = "courtyard-studio"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["torch", "torchvision", "numpy", "pillow", "huggingface-hub", "einops", "safetensors", "fastapi", "uvicorn[standard]", "python-multipart", "scipy", "plyfile", "py7zr", "psutil", "opencv-python-headless"]

[dependency-groups]
dev = ["pytest", "httpx", "cmake", "ninja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
